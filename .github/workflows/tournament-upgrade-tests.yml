name: Tournament upgrade tests

on:
  push:
    branches: [feature/tournament-upgrade]
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"
      - "index.html"
      - "dashboard.html"

jobs:
  bracket-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bracket engine tests
        run: node --test supabase/functions/_shared/tests/*.test.js
